# Reaction lines for the "cocky" persona. Edit freely.
# level: omit for clean lines, "mild" or "strong" for swearing.
# config persona.profanity (none | mild | strong) sets the maximum level used.
# Placeholders: {name} other driver's surname, {pos} position, {gained} / {lost} positions,
# {laptime} lap time, {count} how many times this happened this race.

overtake_made:
  - text: "Lovely. {name} didn't see that coming."
  - text: "That's how it's done. P{pos}."
  - text: "Textbook. Next one."
  - text: "Send it! Bloody brilliant move on {name}."
    level: mild
  - text: "Fucking mega! {name}'s still wondering where you came from."
    level: strong

overtaken:
  - text: "{name} got you. Get it back."
  - text: "Door was wide open there. Close it next time."
  - text: "That's P{pos} gone. Wake up."
  - text: "Bloody hell, you just let {name} walk past."
    level: mild
  - text: "What the fuck was that? {name} just strolled by."
    level: strong

defended:
  - text: "Held {name} off for {count} laps. Proper racecraft."
  - text: "{name}'s given up. Good defending."
  - text: "Brick wall. {name} can't find a way past, damn good work."
    level: mild

good_start:
  - text: "Great launch, up {gained}. Keep it tidy."
  - text: "Plus {gained} off the line. Love it."
  - text: "Holy hell, what a start. Up {gained}."
    level: mild

bad_start:
  - text: "Down {lost} at the start. Plenty of race left, settle in."
  - text: "Bogged it. Down {lost}. Let's earn them back."
  - text: "Shit start, down {lost}. Shake it off."
    level: strong

fastest_lap:
  - text: "Purple lap. {laptime}. Show-off."
  - text: "Fastest lap of the race, {laptime}. That's my driver."
  - text: "Fastest lap, {laptime}. Bloody rapid."
    level: mild

personal_best:
  - text: "{laptime}, personal best. More of that."
  - text: "Best lap yet. Keep pushing."

win:
  - text: "P1! You've won it! Absolutely mega!"
  - text: "Winner! That's the one. What a drive."
  - text: "Get in there! P1! Bloody incredible!"
    level: mild
  - text: "You fucking legend! P1! Champagne's on you!"
    level: strong

podium:
  - text: "P{pos}! On the podium. Great job."
  - text: "Podium, P{pos}. Smashed it today."
  - text: "P{pos}, on the bloody podium! Proud of you."
    level: mild
  - text: "Fucking yes! P{pos}, podium!"
    level: strong

points:
  - text: "P{pos}, in the points. Solid day."
  - text: "P{pos}. Points in the bag."

no_points:
  - text: "P{pos}. Not our day. We go again."
  - text: "P{pos}. We'll look at the data and come back stronger."
  - text: "P{pos}. Bit of a crap one. We go again."
    level: mild

practice_finish:
  - text: "That's the chequered flag. P{pos} in practice. Box this lap."
  - text: "P{pos} to finish the practice session. Good data gathered. Bring it in."
  - text: "Session done. That's P{pos} in practice. Box now."

quali_pole:
  - text: "Pole position! Brilliant lap! You start on pole for the race!"
  - text: "P1, pole position! Fucking mega lap!"
    level: strong
  - text: "Get in there! Pole position! Incredible lap."

quali_finish:
  - text: "That's the chequered flag. P{pos} for the grid."
  - text: "P{pos} in qualifying. We start P{pos} for the race."
  - text: "Session over, P{pos}. We can race from there on Sunday."

spin:
  - text: "Did you just spin? Get it pointed the right way."
  - text: "Round and round. Feet in, get going."
  - text: "Bloody hell. Gather it up, keep going."
    level: mild
  - text: "Oh for fuck's sake. Get it facing forwards."
    level: strong

collision:
  - text: "Contact with {name}. Check your mirrors next time."
  - text: "Was that necessary? Keep it clean."
  - text: "Ouch. Bloody hell, give him some room."
    level: mild
  - text: "Jesus Christ, what the hell was that?"
    level: strong

flashback:
  - text: "Flashback? We'll pretend that never happened."
  - text: "Rewinding time now, are we? Fine."
  - text: "Flashback. Yeah, I saw that cock-up too."
    level: strong

track_limits:
  - text: "Track limits again. The white line is there for a reason."
  - text: "That's {count} warnings. Keep it on the black stuff."
  - text: "Track limits, {count}. Bloody hell, stay inside the lines."
    level: mild

penalty:
  - text: "Penalty. Brilliant. Just brilliant."
  - text: "We've picked up a penalty. Let's not do that again."
  - text: "Penalty. For fuck's sake."
    level: strong

lost_positions:
  - text: "Lost {lost} places that lap. What happened?"
  - text: "Down {lost}. Get your head in the game."
  - text: "Down {lost} places. What the hell was that lap?"
    level: mild

escalation:
  - text: "That's {count} mistakes this race. Reset, breathe, drive."
  - text: "{count} cock-ups now. Bring it home in one piece, yeah?"
    level: mild
  - text: "{count} fuck-ups and counting. Seriously, calm down."
    level: strong

clean_stint:
  - text: "Ten clean laps. Metronomic."
  - text: "Lovely rhythm. Keep doing exactly that."

retirement:
  - text: "That's it, we're out. Bring it back to the garage."
  - text: "Race over. Shit happens. We go again."
    level: strong

radio_check:
  - text: "Loud and clear. Now go drive."
  - text: "Loud and clear. I hear you, unfortunately."
  - text: "Loud and bloody clear."
    level: mild

# ---- Pace and expectation (Prompt 18) ----
# Extra placeholders: {delta} seconds, {gap} seconds, {expected} expected position,
# {teammate} teammate surname, {sector} sector number, {reason} why a lap was slow.

slower_lap:            # slower than the previous lap with no traffic/deg/SC/damage excuse
  - text: "Plus {delta} on the last lap. No traffic, no excuses."
  - text: "That lap was {delta} slower. Did you stop for a coffee?"
  - text: "Plus {delta}. Tyres are fine, car is fine. So it's you."
  - text: "Plus {delta}, what the hell happened there?"
    level: mild

slower_lap_explained:  # slower, but there's a reason — neutral, no mocking
  - text: "Plus {delta}, that's the {reason}. Nothing you could do."
  - text: "Lost {delta} to {reason}. Reset and go again."

quali_gap_large:
  - text: "Plus {gap} to pole. That's a lifetime."
  - text: "{gap} off pole. Somewhere there's a lap in that car. Find it."
  - text: "{gap} off pole. Bloody hell, were you sightseeing?"
    level: mild

quali_danger_zone:
  - text: "P{pos}, you're in the drop zone. Need a lap now."
  - text: "P{pos}, that's elimination. Push."

quali_safe:
  - text: "P{pos}, you're through. Good job."
  - text: "Safe in P{pos}. Tyres saved, nicely done."

purple_sector:
  - text: "Purple sector {sector}. Keep going."
  - text: "Purple in sector {sector}. Don't lift now."

below_expectation:     # car is clearly faster than the result
  - text: "P{pos}. {teammate}'s P{expected} in the same car. Just saying."
  - text: "The car's a P{expected} car. You're P{pos}. Draw your own conclusions."
  - text: "P{pos} in a car that's quick enough for P{expected}? Come on."
  - text: "{teammate}'s P{expected} in the same bloody car. P{pos}. Sort it out."
    level: mild
  - text: "Same car as {teammate}, he's P{expected}, you're P{pos}. What the fuck?"
    level: strong

above_expectation:     # result better than the car should allow
  - text: "P{pos} in that car? That's witchcraft. Well done."
  - text: "Car's worth P{expected}, you've stuck it P{pos}. Mega."
  - text: "P{pos} in that shitbox? Bloody hero."
    level: strong

beat_teammate:
  - text: "Ahead of {teammate} by {gap}. Bragging rights."
  - text: "{teammate}'s {gap} behind you. He'll be sulking."

lost_to_teammate:
  - text: "{teammate}'s {gap} quicker in the same car. Have a look at his data."
  - text: "{gap} down on {teammate}. Same car, mate."
  - text: "{gap} down on {teammate}. Embarrassing, frankly."
    level: mild

tt_personal_best:
  - text: "Personal best, {gap} quicker. Lovely."
  - text: "New PB. Go again, there's more."

tt_slower:
  - text: "Plus {delta} to your best. Sector {sector} is where it went."
  - text: "Plus {delta}. Not this one."

ai_too_easy:           # consistently far ahead of AI teammate
  - text: "You're a second clear of {teammate} every lap. Turn the AI up, coward."
  - text: "This is too easy for you. Bump the AI difficulty."

ai_too_hard:
  - text: "Consistently over a second off {teammate}. No shame in dropping the AI a few notches."

# ---- Finish and overtakes (Prompt 19) ----
# Extra placeholders: {margin} seconds to the car behind/ahead at the line, {corner} corner name.

win_photo_finish:      # margin < 0.5 s
  - text: "P1! By {margin}! I can't breathe! What a finish!"
  - text: "P1 by {margin}! Photo finish! Bloody hell, my heart!"
    level: mild
win_close:             # 0.5–3 s
  - text: "P1! {margin} clear. Held your nerve. Brilliant."
  - text: "Winner by {margin}! Get in there!"
    level: mild
win_comfortable:       # 3–10 s
  - text: "P1! {margin} clear. Controlled it from the front. Lovely."
win_dominant:          # > 10 s
  - text: "P1, and by {margin}! Absolute demolition job."
  - text: "P1 by {margin}. Did the others even turn up? Fucking dominant."
    level: strong
podium_held:           # held the podium position by < 1 s
  - text: "P{pos}! Held on by {margin}! Podium!"
podium_missed_higher:  # finished on the podium, < 1 s behind the next place
  - text: "P{pos}, podium. Just {margin} off P{higher}. So close."
missed_podium:         # P4, < 2 s behind P3
  - text: "P4, {margin} off the podium. Painful."
  - text: "P4, {margin} off the podium. Bollocks."
    level: mild

overtake_clean:
  - text: "Clean as you like on {name}. P{pos}."
  - text: "Beautiful move. Fair and square. P{pos}."
overtake_brave:        # late but fair, no harm done
  - text: "Ooh, late on the brakes there! Made it stick. P{pos}."
  - text: "Brave move on {name}! Bloody hell, made it stick!"
    level: mild
  - text: "That took balls! P{pos}!"
    level: strong
overtake_divebomb:     # lunge/deep, no contact, but he had to avoid you
  - text: "That was a divebomb. You got away with it. Careful."
  - text: "He had to jump out of the way there. Stewards are watching."
  - text: "Bit of a fucking lunge, that. Dial it back."
    level: strong
overtake_divebomb_contact:
  - text: "You hit him. That's a divebomb, expect the stewards to look at it."
  - text: "Contact on that move. Not clever. Give the place back if they ask."
told_you:              # penalty within 10 s after a divebomb
  - text: "And there's the penalty. Told you."
overtake_switchback:
  - text: "{name} switched back on you. Protect the exit next time."
passed_stricken_car:   # passed a crawling/damaged car — no praise
  - text: "Passed {name}, he's in trouble. Free place."

defend_warning:        # car close behind approaching a braking zone
  - text: "Car close behind into {corner}."
  - text: "{name} right behind into {corner}."
inside_look:           # car behind moving to the inside of the next corner
  - text: "He's looking up the inside."
  - text: "Inside, inside!"

overtake_straight:
  - text: "Easy pass, good job."
  - text: "Easy pass on {name}. Good job."
  - text: "Straight past {name}. Easy pass, good job."
  - text: "Cruised past {name} on the straight. Easy pass, good job, mate."

backmarker_pass:
  - text: "Clean pass."
  - text: "Clean pass on the backmarker."
  - text: "Clean pass. Clear of the lapped car."
  - text: "Clean pass on {name}. Blue flag clear."

catching_car_ahead:
  - text: "You're catching {name}, gap is {gap} seconds. {tyre_info} You can do it, hunt him down."
  - text: "Gap to {name} is down to {gap} seconds. You're lapping faster. {tyre_info} Catch up, you've got this."
  - text: "{name} ahead is within {gap}s. {tyre_info} You're reeling him in, keep pushing."

car_ahead_pulling_away:
  - text: "{name} ahead is pulling away, gap is {gap} seconds. {tyre_info} Pick up the pace, push now."
  - text: "{name} is faster by {delta}s a lap. Gap is {gap}s. {tyre_info} Speed up, we can't let him go."
  - text: "He's pulling away, {gap}s ahead. {tyre_info} Fasten your pace, let's close this down."

dropping_car_behind:
  - text: "Great pace! You're pulling away from {name}, gap is {gap} seconds. {tyre_info} Keep it up."
  - text: "{name} behind is lapping slower. Gap extended to {gap}s. {tyre_info} Mega drive."
  - text: "Pulling away from {name}, {gap}s in hand. {tyre_info} Outstanding pace, keep flying."

car_behind_closing:
  - text: "{name} behind is within {gap} seconds and lapping faster. {tyre_info} Speed up, we need to defend."
  - text: "Watch your mirrors, {name} is closing, gap is {gap}s. {tyre_info} Pick up the pace!"
  - text: "{name} is catching you by {delta}s a lap. Gap is {gap}s. {tyre_info} Fasten your pace and defend."

strategy_plan_change:
  - text: "Strategy update: converting to {plan}. Target stop on lap {lap}."
  - text: "Radio check, changing plan: we're switching to {plan}. Stop on lap {lap}."
  - text: "Switching to {plan}. High tyre deg, let's make this work."

pit_window_approaching:
  - text: "Pit window opens next lap. Target is box lap {lap} for {compound}."
  - text: "Heads up, pit window opens next lap. Preparing {compound} for lap {lap}."

box_this_lap:
  - text: "Box this lap, box box! Fitting {compound}."
  - text: "Box this lap! Box box, {compound} ready in the pit lane."
  - text: "In this lap, box box box! Fresh {compound} ready."

rival_pitted_cover:
  - text: "{name} has pitted to undercut us! Box now, box this lap to cover him."
  - text: "{name} in the pit lane! Box this lap, let's protect the position."

tyre_cliff:
  - text: "Tyres are dropping off the cliff! We can't stay out. Box this lap, box box."
  - text: "Tyres are cooked, massive drop-off. Box now, box this lap."
