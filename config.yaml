# Race Engineer Configuration
# Target: Windows 11, RTX 2050 (4GB VRAM) - all local AI runs on CPU by default.

telemetry:
  host: "0.0.0.0"
  port: 20777
  ptt_action: 1                # In-game "UDP Action 1" button bound to wheel
  ask_port: false              # Prompt interactively for ports on launch if true (or use --ask-port)

audio:
  input_device: null           # Device name or index (null = default system mic)
  output_device: null          # Device name or index (null = default system headset)
  sample_rate: 16000           # 16 kHz mono for STT

stt:
  model: "small.en"            # faster-whisper model ("small.en", "base.en", "distil-small.en")
  compute_type: "int8"         # CPU quantization
  device: "cpu"
  beam_size: 1
  min_duration_s: 0.25         # Ignore button clicks shorter than 250ms
  max_duration_s: 15.0         # Transmission cap
  pre_roll_ms: 300             # Ring buffer to prevent clipping first syllable
  ptt_source: "udp"            # "udp" (in-game wheel action) or "joystick"
  joystick_index: 0
  joystick_button: 0

tts:
  engine: "piper"              # "piper" (local CPU), "kokoro" (local CPU), or "edge" (cloud)
  voice: "en_GB-alan-medium"   # British race engineer voice
  device: "cpu"
  radio_fx: true               # Band-pass filter, compression, static, and clicks

llm:
  primary: "groq"              # "groq" | "ollama" | "openai_compatible"
  fallback: "ollama"           # used if primary errors, times out, or no internet; or null
  timeout_s: 4.0
  max_tokens: 60
  groq:
    model: "llama-3.1-8b-instant"
    api_key_env: "GROQ_API_KEY"
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:3b-instruct"
    num_gpu: 0                 # 0 = CPU only (keeps RTX 2050 free for the game)
  openai_compatible:
    base_url: "http://localhost:8080/v1"
    model: "local"

knowledge:
  enabled: true
  tracks_dir: "knowledge/tracks"
  general_path: "knowledge/general.md"
  max_tokens: 400

redis:
  enabled: false
  url: "redis://localhost:6379/0"
  hz: 10.0

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8765
  hz: 10.0
  token: "xlQvJBOipAGFjQbTXmdOhA"                 # Auto-generated shared secret token on first run if null

spotter:
  enabled: true
  lateral_distance_m: 3.6
  longitudinal_distance_m: 4.8
  still_there_interval_s: 2.5
  min_speed_kph: 20.0

debrief:
  auto_lap_debrief: true
  reference_lap: "session"                        # "session" | "stint" | "all_time"
  worst_corner_threshold_s: 0.15
  track_limits_callouts: true
  track_limits_penalty_at: null                   # e.g. 3 -> "Track limits warning, 2 of 3."

persona:
  name: cocky                                     # file in lines/ and prompts/personas/; "professional" = no reactions
  profanity: mild                                 # none | mild | strong — max line level used
  reaction_frequency: normal                      # low | normal | high (scales cooldowns)
  min_gap_s: 20                                   # minimum time between personality reactions

logging:
  level: "INFO"
  format: "%(asctime)s %(levelname)s %(name)s: %(message)s"

usage:
  allow_paid: false                                   # Never exceed free tier limits or incur charges
  max_fraction: 0.8                                   # Safety margin: stop at 80% of any limit (minute or day)
  # Checked: 2026-10-29 from console.groq.com/docs/rate-limits
  groq_models:
    llama-3.1-8b-instant:
      rpm: 30
      rpd: 14400
      tpm: 6000
      tpd: 500000
    llama-3.3-70b-versatile:
      rpm: 30
      rpd: 1000
      tpm: 12000
      tpd: 100000
    whisper-large-v3:
      rpm: 20
      rpd: 2000
      ash: 7200                                       # Audio seconds per hour
      asd: 28800                                      # Audio seconds per day
    whisper-large-v3-turbo:
      rpm: 20
      rpd: 2000
      ash: 7200
      asd: 28800
  edge_tts:
    # Note: edge-tts has no published quota; these are our own conservative self-imposed limits, not an official quota
    rpm: 20
    rpd: 2000
    chars_per_min: 10000
    chars_per_day: 200000

radio_check:
  on_session_start: true                              # Automatic radio check 3s after session starts

sound_test:
  on_app_start: true                                  # Startup chime/speech: "Engineer online." on app open

volumes:
  engineer: 1.0                                       # Volume factor for engineer voice (0.0 to 1.0)
  spotter: 1.0                                        # Volume factor for spotter calls (0.0 to 1.0)
  menu_beeps: 1.0                                     # Volume factor for radio beeps / clicks (0.0 to 1.0)

pace:
  slower_lap_threshold_s: 0.5                         # Gap vs previous valid lap before calling driver slower
  fuel_effect_s_per_kg: 0.03                          # Expected gain in s per kg of fuel burned
  expectation_margin: 3                               # Positions delta vs expected performance before calling out

quali:
  eliminated_per_segment: null                        # Null = auto-derived from car count (6 for 22 cars, 5 for 20 cars)
  large_gap_s: 1.0                                    # Gap to pole in seconds for quali_gap_large


