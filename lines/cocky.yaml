    level: mild
  - text: "Fuck me, that was close! Won by {margin}s! Absolute scenes!"
    level: strong

win_close:
  - text: "P1! Kept your cool with {name} right on your gearbox. Great drive."
  - text: "Winner! Squeaked it home by {margin}s. Mega drive."
  - text: "Get in! P1 by {margin}s! Bloody fantastic defence at the end."
    level: mild
  - text: "You fucking beauty! P1, held him off by {margin}s!"
    level: strong

win_comfortable:
  - text: "P1! Controlled that beautifully. {margin}s in hand at the flag."
  - text: "Winner! Comfortable gap of {margin}s at the finish. Top job."
  - text: "Bloody dominant, {margin}s clear! Drink it in."
